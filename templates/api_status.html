<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>AgriTwin API Status 🌾</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='status.css') }}">
  <script>
    async function loadStatus() {
      const res = await fetch("/api-status-json");
      const data = await res.json();
      const container = document.getElementById("status-container");
      container.innerHTML = "";

      for (const [name, info] of Object.entries(data.status)) {
        const div = document.createElement("div");
        div.className = "card " + (info.status.includes('OK') ? "ok" : "error");
        div.innerHTML = `
          <h3>${name}</h3>
          <p>Path: <code>${info.path}</code></p>
          <p>Status: ${info.status}</p>
        `;
        container.appendChild(div);
      }

      document.getElementById("last-update").textContent =
        new Date().toLocaleTimeString();
    }

    // Auto refresh every 10s
    setInterval(loadStatus, 10000);
    window.onload = loadStatus;
  </script>
</head>
<body>
  <h1>🌿 AgriTwin Backend – API Status Dashboard</h1>
  <p>Dernière mise à jour : <span id="last-update"></span></p>
  <div id="status-container" class="grid"></div>
</body>
</html>
